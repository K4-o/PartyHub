<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#4338ca" />
      <stop offset="60%" stopColor="#1e1b4b" />
      <stop offset="100%" stopColor="#0f0c20" />
    </radialGradient>

    <!-- Character Body Gradient (Soft Indigo/Blue) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#4f46e5" />
    </linearGradient>

    <!-- Coat Gradient (Warm Tan/Caramel) -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>

    <!-- Hat Gradient -->
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#92400e" />
    </linearGradient>

    <!-- Magnifying Glass Glass Gradient -->
    <radialGradient id="glassGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.8" />
      <stop offset="40%" stopColor="#38bdf8" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#0284c7" stopOpacity="0.7" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Atmospheric Pastel Circles -->
  <circle cx="100" cy="120" r="80" fill="#6366f1" opacity="0.2" />
  <circle cx="420" cy="380" r="100" fill="#f43f5e" opacity="0.15" />
  <circle cx="400" cy="100" r="60" fill="#38bdf8" opacity="0.2" />

  <!-- Mystery Question Mark Floating -->
  <g filter="url(#softGlow)" transform="translate(340, 90) rotate(12)">
    <circle cx="20" cy="20" r="32" fill="#fbbf24" opacity="0.2" />
    <path d="M 12 10 C 12 0, 32 0, 32 10 C 32 18, 22 18, 22 26" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" />
    <circle cx="22" cy="37" r="4" fill="#fbbf24" />
  </g>

  <!-- Shadow below character -->
  <ellipse cx="250" cy="425" rx="110" ry="22" fill="#050310" opacity="0.5" />

  <!-- Detective Chibi Character Body -->
  <!-- Tail -->
  <path d="M 160 360 C 130 380, 110 330, 140 310" fill="none" stroke="#4f46e5" stroke-width="20" stroke-linecap="round" />

  <!-- Body / Feet -->
  <ellipse cx="215" cy="405" rx="22" ry="14" fill="#4338ca" />
  <ellipse cx="285" cy="405" rx="22" ry="14" fill="#4338ca" />
  <rect x="180" y="270" width="140" height="130" rx="60" fill="url(#bodyGrad)" />

  <!-- Trench Coat -->
  <path d="M 175 300 Q 250 315 325 300 L 335 390 Q 250 410 165 390 Z" fill="url(#coatGrad)" />
  <!-- Coat Collar -->
  <polygon points="190,300 230,340 215,300" fill="#92400e" />
  <polygon points="310,300 270,340 285,300" fill="#92400e" />
  <!-- Coat Buttons -->
  <circle cx="240" cy="345" r="5" fill="#fef3c7" />
  <circle cx="240" cy="370" r="5" fill="#fef3c7" />

  <!-- Head -->
  <circle cx="250" cy="220" r="75" fill="url(#bodyGrad)" />
  <!-- Ears -->
  <polygon points="190,175 160,115 215,145" fill="#4f46e5" />
  <polygon points="188,168 170,128 206,148" fill="#f472b6" />
  <polygon points="310,175 340,115 285,145" fill="#4f46e5" />
  <polygon points="312,168 330,128 294,148" fill="#f472b6" />

  <!-- Detective Fedora Hat -->
  <ellipse cx="250" cy="165" rx="85" ry="18" fill="url(#hatGrad)" />
  <path d="M 195 165 C 190 100, 310 100, 305 165 Z" fill="url(#hatGrad)" />
  <!-- Hat Ribbon -->
  <path d="M 194 153 C 220 160, 280 160, 306 153 L 306 163 C 280 170, 220 170, 194 163 Z" fill="#1e1b4b" />

  <!-- Big Kawaii Chibi Eyes (Glancing playfully sideways) -->
  <ellipse cx="225" cy="215" rx="14" ry="18" fill="#0f172a" />
  <ellipse cx="275" cy="215" rx="14" ry="18" fill="#0f172a" />
  <!-- Eye Highlights (Kawaii sparkle) -->
  <circle cx="221" cy="209" r="6" fill="#ffffff" />
  <circle cx="227" cy="221" r="2.5" fill="#ffffff" />
  <circle cx="271" cy="209" r="6" fill="#ffffff" />
  <circle cx="277" cy="221" r="2.5" fill="#ffffff" />

  <!-- Cute Nose & Mouth -->
  <polygon points="250,227 245,223 255,223" fill="#f43f5e" />
  <path d="M 245 231 Q 250 236 255 231" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cute Blushing Cheeks -->
  <ellipse cx="205" cy="232" rx="12" ry="7" fill="#f472b6" opacity="0.6" />
  <ellipse cx="295" cy="232" rx="12" ry="7" fill="#f472b6" opacity="0.6" />

  <!-- Detective Sunglasses / Shades perched on nose -->
  <path d="M 210 205 Q 250 202 290 205" fill="none" stroke="#1e1b4b" stroke-width="3" />

  <!-- Magnifying Glass held in hand -->
  <g transform="translate(130, 270) rotate(-25)">
    <!-- Handle -->
    <rect x="52" y="85" width="14" height="48" rx="7" fill="#92400e" stroke="#78350f" stroke-width="2" />
    <!-- Rim -->
    <circle cx="59" cy="50" r="42" fill="none" stroke="#fbbf24" stroke-width="10" />
    <!-- Glass Lens with Glare -->
    <circle cx="59" cy="50" r="37" fill="url(#glassGrad)" />
    <path d="M 38 35 A 25 25 0 0 1 75 25" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Paws holding coat / glass -->
  <circle cx="195" cy="340" r="14" fill="#6366f1" />
  <circle cx="305" cy="340" r="14" fill="#6366f1" />

  <!-- Little Sparkles -->
  <polygon points="120,90 123,98 131,101 123,104 120,112 117,104 109,101 117,98" fill="#fbbf24" opacity="0.8" />
  <polygon points="410,240 412,246 418,248 412,250 410,256 408,250 402,248 408,246" fill="#38bdf8" opacity="0.7" />
</svg>
